services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/voiceguard.db
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/artifacts
      DEVICE: auto
    volumes:
      - vg-data:/data
      - vg-models:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s # model loading is slow; do not fail the container for it

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["5173:80"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  vg-data:
  vg-models:
