[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voiceguard-backend"
version = "0.1.0"
description = "VoiceGuard — AI-powered multi-signal deepfake voice and scam call detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ── Web framework ──
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.7",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.1.0",

    # ── Database ──
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",

    # ── Auth ──
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",

    # ── Rate limiting ──
    "slowapi>=0.1.9",

    # ── Logging ──
    "structlog>=24.1.0",

    # ── AI / ML ──
    "torch>=2.2.0",
    "timm>=0.9.12",
    "librosa>=0.10.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "faster-whisper>=1.0.0",
    "transformers>=4.38.0",
    "sentencepiece>=0.2.0",
    "scikit-learn>=1.4.0",
    "safetensors>=0.4.0",

    # ── Audio utilities ──
    "webrtcvad-wheels>=2.0.10",

    # ── Visualization ──
    "matplotlib>=3.8.0",
    "pillow>=10.2.0",

    # ── HTTP client (for HF Hub downloads) ──
    "huggingface-hub>=0.20.0",
    "httpx>=0.27.0",

    # ── UUID generation ──
    "uuid7>=0.1.0",

    # ── Boto3 for S3 ──
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pip-audit>=2.7.0",
]
train = [
    "wandb>=0.16.0",
    "tensorboard>=2.15.0",
    "captum>=0.7.0",
    "torchaudio>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "ai"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes, pycodestyle
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "B",              # flake8-bugbear
    "SIM",            # flake8-simplify
    "RUF",            # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app", "ai"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "ai.*",
    "app.schemas.*",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "soundfile.*",
    "faster_whisper.*",
    "webrtcvad.*",
    "timm.*",
    "transformers.*",
    "sentencepiece.*",
    "sklearn.*",
    "scipy.*",
    "PIL.*",
    "jose.*",
    "passlib.*",
    "slowapi.*",
    "uuid7.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
